name: Windows portable browser build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/scryer-http-indexer
    paths:
      - app/**
      - ui/**
      - scryer/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/windows.yml

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      PYTHONUTF8: '1'
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          npm install --global corepack --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Set up Rust and WASI target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-wasip2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.98.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test indexer, metadata worker, and download client
        run: |
          cargo test --locked --manifest-path scryer/indexer/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path scryer/service/Cargo.toml --features test-fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path scryer/download-client/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows download processes and indexer proxy
        run: |
          uv sync --frozen --group dev --python 3.13
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen python -m compileall -q app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen pytest app/tests/test_windows_download.py app/tests/test_scryer_indexer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable Windows package
        run: ./scryer/windows/build.ps1
      - name: Smoke test bundled runtime, browser UI, indexer, and real download
        run: |
          & ./dist/metube-scryer-windows-x64/runtime/python.exe ./scryer/windows/smoke.py --bundle ./dist/metube-scryer-windows-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Write package checksum
        run: |
          $package = Get-Item -LiteralPath ./dist/metube-scryer-windows-x64.zip
          $digest = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($package.Name)" | Set-Content -LiteralPath "$($package.FullName).sha256" -Encoding ascii
          Get-Content -LiteralPath "$($package.FullName).sha256"
      - name: Upload Windows package and checksum
        uses: actions/upload-artifact@v7
        with:
          name: metube-scryer-windows-x64
          path: |
            dist/metube-scryer-windows-x64.zip
            dist/metube-scryer-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
