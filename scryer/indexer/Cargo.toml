[package]
name = "youtube-library-indexer"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Third-party yt-dlp indexer service adapter emitting verified YouTube HTTP provider-page releases for MeTube"
autoexamples = false

[package.metadata.scryer]
official = false
plugin_id = "youtube-library"
status = "beta"
catalog_versions = ["v3"]
min_scryer_version = "0.23.0"
docs_url = "https://github.com/CrypticzXI/metube-scryer/tree/feature/scryer-http-indexer/scryer"
source_repo = "https://github.com/CrypticzXI/metube-scryer/tree/feature/scryer-http-indexer/scryer/indexer"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "indexer-descriptor"
path = "examples/descriptor.rs"

[dependencies]
scryer-plugin-sdk = "=3.18.0"
scryer-plugin-pdk = "=0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.plugin-release]
inherits = "release"
lto = "thin"
strip = true
panic = "abort"
