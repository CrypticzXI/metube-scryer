[package]
name = "metube-download-client"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-only"
description = "Vendored MeTube HTTP download client plugin with SDK 3.18 compatibility"
autoexamples = false

[package.metadata.scryer]
official = false
plugin_id = "metube"
status = "beta"
catalog_versions = ["v3"]
min_scryer_version = "0.23.0"
docs_url = "https://github.com/CrypticzXI/metube-scryer/tree/feature/scryer-http-indexer/scryer/download-client"
source_repo = "https://github.com/CrypticzXI/metube-scryer/tree/feature/scryer-http-indexer/scryer/download-client"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "download-client-descriptor"
path = "examples/descriptor.rs"

[dependencies]
base64 = "0.23"
scryer-plugin-sdk = "=3.18.0"
scryer-plugin-pdk = "=0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.61"

[profile.plugin-release]
inherits = "release"
opt-level = 3
lto = "fat"
strip = true
panic = "abort"
